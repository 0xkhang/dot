set -g default-terminal "st-256color"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-can

bind -r e split-window -h "nvim ~/writings/scratch/notes_$(date +'%d%m%y').md"
bind -n M-h resize-pane -L 1
bind -n M-j resize-pane -D 1
bind -n M-k resize-pane -U 1
bind -n M-l resize-pane -R 1

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# start from 1, not 0
set-option -g base-index 1
# re-number when closing windows
set-option -g renumber-windows on

# set -g status-style 'bg=#3a3a3a'

# tmux navigation compatible with vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
      | grep -iqE '^[^TXZ ]+ +(n?vim|vimx?)$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-fg "#000000"
# set -g @minimal-tmux-bg "#d369af"
set -g @minimal-tmux-bg "#9e95c7"
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-status "bottom"
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true
set -g @minimal-tmux-show-expanded-icon-for-all-tabs true
set -g @minimal-tmux-status-right-extra ""
set -g @minimal-tmux-status-left-extra ""
set -g status-right-length 20
set -g status-left-length 10
set -g @minimal-tmux-status-left " #S "
set -g @minimal-tmux-status-right " %H:%M %a %d %b "

set -gq allow-passthrough on
set -g visual-activity off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
