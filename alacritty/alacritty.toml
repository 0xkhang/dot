[general]
import = [
    "~/.config/alacritty/themes/themes/gruber_darker.toml"
]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
decorations = "Full"
startup_mode = "Maximized"
dynamic_title = false
title = "not a simple terminal"

[font]
normal = {family = "Iosevka", style = "Regular"}
size = 15

[colors]
cursor = { text = "#000000", cursor = "#ffdd33" }

[selection]
save_to_clipboard = false

[mouse]
hide_when_typing = true

[cursor]
style = { shape = "Block", blinking= "Always"}
blink_interval = 550
